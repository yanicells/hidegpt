# Modelled on T3 Code's CI (.github/workflows/ci.yml): read-only permissions, one run
# per pull request with stale runs cancelled, and a cached pnpm install. HideGPT is
# one package, so one job runs every check. No Electron e2e and no secrets.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Typecheck, lint, knip and the unit tests never launch Electron, so skip its
      # ~100 MB download in postinstall.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Files and dependencies are repo-wide, so knip runs on the whole project.
      - name: Check unused code
        run: pnpm knip

      - name: Test
        run: pnpm test

      # Catches bundle-only breakage (bad imports, Vite config) that tsc misses.
      - name: Build
        run: pnpm build

      # No banned word in the built renderer or preload (scripts/stealth-allow.json lists the exceptions).
      - name: Stealth scan
        run: pnpm stealth:scan
