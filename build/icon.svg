<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Docs logo on a white macOS tile, as an installed Docs app shows in the Dock.
       Source for icon.icns (render at 1024px, then iconutil). -->
  <defs>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="fold-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A47A8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1A47A8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#FFFFFF" filter="url(#drop)"/>
  <!-- The page: 384 x 528 (the logo's 8:11), folded corner 144. -->
  <path d="M352 248 H592 L736 392 V740 a36 36 0 0 1 -36 36 H352 a36 36 0 0 1 -36 -36 V284 a36 36 0 0 1 36 -36 Z" fill="#4285F4"/>
  <path d="M592 392 L736 536 V392 Z" fill="url(#fold-shadow)"/>
  <path d="M592 248 V356 a36 36 0 0 0 36 36 H736 Z" fill="#A1C2FA"/>
  <g fill="#FFFFFF">
    <rect x="412" y="476" width="228" height="28" rx="6"/>
    <rect x="412" y="538" width="228" height="28" rx="6"/>
    <rect x="412" y="600" width="228" height="28" rx="6"/>
    <rect x="412" y="662" width="152" height="28" rx="6"/>
  </g>
</svg>
